name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify_release.py --tag "$RELEASE_TAG"
          python scripts/verify_readme_consistency.py

      - name: Wait for CI checks for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD^{commit})"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --limit 10 \
              --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            if [ -n "$run_id" ]; then
              echo "Watching CI run $run_id"
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            echo "Waiting for CI run for $RELEASE_SHA (attempt $attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for CI checks for $RELEASE_SHA" >&2
          exit 1

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distributions and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
          python -m twine check dist/*

      - name: Smoke test installed wheel SDK
        run: |
          release_venv="$RUNNER_TEMP/release-venv"
          python -m venv "$release_venv"
          "$release_venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          "$release_venv/bin/python" -c \
            'import os; from backend.core.metadata import PROJECT_VERSION; assert PROJECT_VERSION == os.environ["RELEASE_VERSION"]'
          "$release_venv/bin/python" - <<'PY'
          from backend.core import NL2SQLGenerator, SQLTranspiler

          converted = SQLTranspiler().transpile("SELECT id FROM users LIMIT 2", "postgres", "mysql")
          assert converted.success, converted.error
          generated = NL2SQLGenerator().generate("查询所有用户", dialect="mysql")
          assert generated.success, generated.explanation
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          section = Path("CHANGELOG.md").read_text(encoding="utf-8").split(f"## [{version}]", 1)[1]
          notes = section.partition("\n")[2].split("\n## [", 1)[0].strip()
          assert notes, "release notes are empty"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file release-notes.md --title "$RELEASE_TAG"
