name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          import os

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Unsupported release tag format: {tag}")

          with Path("pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle)
          project_version = project["project"]["version"]
          tag_version = tag.removeprefix("v")

          if project_version != tag_version:
              raise SystemExit(
                  "Release tag/version mismatch: "
                  f"tag={tag_version}, pyproject.toml={project_version}"
              )

          print(f"Release version verified: {project_version}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "${{ github.ref_name }}"
