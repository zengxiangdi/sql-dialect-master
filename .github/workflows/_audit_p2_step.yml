name: audit-p2-step

on:
  push:
    branches: ["audit/close-p1-p2-gaps"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]" --no-deps
      - name: Apply P2-3 source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/api/main.py")
          text = path.read_text()
          replacements = {
              'checks["transpiler"] = {"status": "❌ error", "message": str(e)}': 'checks["transpiler"] = {"status": "❌ error", "code": "probe_failed"}',
              'checks["functions"] = {"status": "❌ error", "message": str(e)}': 'checks["functions"] = {"status": "❌ error", "code": "probe_failed"}',
              'checks["types"] = {"status": "❌ error", "message": str(e)}': 'checks["types"] = {"status": "❌ error", "code": "probe_failed"}',
              'checks["nl2sql"] = {"status": "❌ error", "message": str(e)}': 'checks["nl2sql"] = {"status": "❌ error", "code": "probe_failed"}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source pattern missing: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Run targeted health tests
        run: pytest -q backend/tests/test_health_semantics_p2.py backend/tests/test_audit_remaining_gaps.py -k "deep_health or health_deep"
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api/main.py
          git diff --cached --check
          git commit -m "fix: sanitize legacy deep health exceptions"
          git push origin HEAD:audit/close-p1-p2-gaps
