name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e "." --no-deps

      - name: Run reproducible benchmark
        run: |
          python backend/benchmarks/transpiler_benchmark.py \
            --iterations 100 \
            --repeats 3 \
            --concurrency 8 \
            > benchmark.json

      - name: Run statement validation profiler
        run: |
          python backend/benchmarks/statement_validation_profile.py \
            --iterations 100 \
            --repeats 5 \
            > statement-validation-profile.json

      - name: Run cache-key profiler
        run: |
          python backend/benchmarks/cache_key_profile.py \
            --repeats 1000 \
            > cache-key-profile.json

      - name: Publish benchmark summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("benchmark.json").read_text(encoding="utf-8"))
          profile = json.loads(Path("statement-validation-profile.json").read_text(encoding="utf-8"))
          cache_profile = json.loads(Path("cache-key-profile.json").read_text(encoding="utf-8"))
          sync = payload["sync"]["mean_seconds"]
          async_mean = payload["async"]["mean_seconds"]
          speedup = payload["async_speedup"]
          workload = payload["workload"]

          print("## Transpiler benchmark")
          print()
          print(
              f"- Workload: {workload['iterations']} statements × "
              f"{workload['repeats']} repeats ({workload['source']} → {workload['target']})"
          )
          print(f"- Sync mean: `{sync:.4f}s`")
          print(f"- Async mean: `{async_mean:.4f}s`")
          print(f"- Async speedup: `{speedup:.2f}x`")
          print()
          print("### Profiling hotspots")
          for config in payload["profiling"]["configurations"]:
              label = (
                  f"cache={config['cache_enabled']}, "
                  f"security={config['security_enabled']}, "
                  f"validate={config['validate']}"
              )
              hotspots = ", ".join(
                  f"{item['stage']} ({item['percent_of_mean']:.1f}%)"
                  for item in config["top_hotspots"]
              )
              print(f"- `{label}`: {hotspots}")

          print()
          print("### Statement validation breakdown")
          measurements = profile["measurements"]
          print(
              f"- `_has_multiple_statements`: "
              f"`{measurements['has_multiple_statements']['per_statement_ms']:.4f} ms/statement`"
          )
          print(
              f"- `sqlglot.parse()`: "
              f"`{measurements['sqlglot_parse_only']['per_statement_ms']:.4f} ms/statement`"
          )
          print(
              f"- `parse() + count`: "
              f"`{measurements['sqlglot_parse_and_count']['per_statement_ms']:.4f} ms/statement`"
          )
          print(
              f"- Parse share of validation: "
              f"`{profile['analysis']['parse_share_of_statement_validation_percent']:.1f}%`"
          )

          cache_measurements = cache_profile["measurements"]
          cache_analysis = cache_profile["analysis"]
          print()
          print("### Cache-key breakdown")
          print(
              f"- `_cache_key()`: `" 
              f"{cache_measurements['cache_key']['per_call_us']:.2f} µs/call`"
          )
          print(
              f"- Rule payload build: `"
              f"{cache_measurements['rule_payload_build']['per_call_us']:.2f} µs/call` "
              f"({cache_analysis['payload_share_of_cache_key_percent']:.1f}% of end-to-end)"
          )
          print(
              f"- Rule-version hash: `"
              f"{cache_measurements['rule_version_hash']['per_call_us']:.2f} µs/call` "
              f"({cache_analysis['hash_share_of_cache_key_percent']:.1f}% of end-to-end)"
          )
          print(
              f"- Rules: `{cache_profile['workload']['rule_count']}`, "
              f"payload: `{cache_profile['workload']['rule_payload_bytes']} bytes`"
          )
          print()
          print("Benchmark is informational in CI; it does not enforce a fixed latency threshold.")
          PY

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transpiler-benchmark-${{ github.sha }}
          path: |
            benchmark.json
            statement-validation-profile.json
            cache-key-profile.json
          if-no-files-found: error
          retention-days: 14
