name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "audit/**"]
  pull_request:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qa]"

      - name: Ruff correctness checks
        run: ruff check backend frontend sdm_local.py --select E9,F

      - name: Bandit security scan
        run: bandit -q -r backend -x backend/tests

      - name: Dependency vulnerability audit
        run: pip-audit
