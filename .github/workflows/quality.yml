name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked project and quality tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-lock.txt
          .venv/bin/python -m pip install -e . --no-deps
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff correctness checks
        run: ruff check backend/core backend/api --select E9,F --ignore F401

      - name: Progressive mypy checks
        run: .venv/bin/python -m mypy

      - name: Bandit security scan
        run: |
          # Reviewed static-analysis exceptions:
          # B104 = intentional API service bind in the local/server entry point.
          # B110 = legacy parser fallback intentionally continues with regex checks.
          # B608 = NL2SQL returns generated SQL, never executes it; output is parser-validated.
          bandit -q -r backend -x backend/tests -s B104,B110,B608

      - name: Dependency vulnerability audit
        run: pip-audit
