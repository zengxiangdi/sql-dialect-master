name: Quality

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked project and quality tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-lock.txt
          .venv/bin/python -m pip install -e . --no-deps
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff correctness checks
        run: ruff check backend/core backend/api --select E9,F --ignore F401

      - name: Ruff NL2SQL default checks
        run: ruff check backend/core/nl2sql_pipeline backend/core/nl2sql_components

      - name: Progressive mypy checks
        run: .venv/bin/python -m mypy

      - name: Mypy NL2SQL directories
        run: .venv/bin/python -m mypy backend/core/nl2sql_pipeline backend/core/nl2sql_components

      - name: Ruff remaining core checks
        run: >-
          ruff check backend/core
          --exclude backend/core/nl2sql_pipeline
          --exclude backend/core/nl2sql_components

      - name: Mypy remaining core checks
        run: >-
          .venv/bin/python -m mypy backend/core
          --exclude backend/core/nl2sql_pipeline
          --exclude backend/core/nl2sql_components

      - name: Ruff API test checks
        run: >-
          ruff check backend/tests/test_api*.py
          backend/tests/test_middleware.py
          backend/tests/test_readiness*.py
          backend/tests/test_rate_limit*.py

      - name: Mypy API test checks
        run: >-
          .venv/bin/python -m mypy backend/tests/test_api*.py
          backend/tests/test_middleware.py
          backend/tests/test_readiness*.py
          backend/tests/test_rate_limit*.py

      - name: Ruff NL2SQL test checks
        run: ruff check backend/tests/test_nl2sql*.py

      - name: Mypy NL2SQL test checks
        run: .venv/bin/python -m mypy backend/tests/test_nl2sql*.py

      - name: Ruff all test checks
        run: ruff check backend/tests

      - name: Mypy all test checks
        run: .venv/bin/python -m mypy backend/tests

      - name: Ruff full backend checks
        run: ruff check backend

      - name: Mypy full backend checks
        run: .venv/bin/python -m mypy backend

      - name: Bandit security scan
        run: |
          # Reviewed static-analysis exceptions:
          # B104 = intentional API service bind in the local/server entry point.
          # B110 = legacy parser fallback intentionally continues with regex checks.
          # B608 = NL2SQL returns generated SQL, never executes it; output is parser-validated.
          bandit -q -r backend -x backend/tests -s B104,B110,B608

      - name: Dependency vulnerability audit
        run: pip-audit
