name: Temporary P2-2 closeout

on:
  push:
    branches: ["audit/close-p1-p2-gaps"]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Make P2-2 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("backend/api/main.py")
          text = main.read_text(encoding="utf-8")
          start = text.index('@app.get("/health", tags=["system"])')
          end = text.index('\n\n@app.get("/health/deep", tags=["system"])', start)
          replacement = '''@app.get("/health", tags=["system"])
          async def health_check():
              """Return process liveness without probing business dependencies."""
              return {
                  "status": "alive",
                  "version": API_VERSION,
                  "timestamp": datetime.now().isoformat(),
              }
          '''
          main.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test = Path("backend/tests/test_p2_liveness.py")
          test.write_text('''from fastapi.testclient import TestClient\n\nfrom backend.api.main import app\n\n\ndef test_health_is_true_liveness(monkeypatch):\n    def fail_probe(*args, **kwargs):\n        raise AssertionError("liveness must not invoke dependency probes")\n\n    from backend.api import readiness\n    monkeypatch.setattr(readiness, "_get_checks", fail_probe)\n\n    response = TestClient(app).get("/health")\n\n    assert response.status_code == 200\n    assert response.json()["status"] == "alive"\n    assert response.json()["version"]\n    assert "services" not in response.json()\n    assert "stats" not in response.json()\n\n\ndef test_health_liveness_survives_business_component_failure(monkeypatch):\n    from backend.api import main\n    monkeypatch.setattr(main.func_encyclopedia, "get_function", lambda *a, **k: (_ for _ in ()).throw(RuntimeError("broken")))\n    monkeypatch.setattr(main.type_mapper, "map_type", lambda *a, **k: (_ for _ in ()).throw(RuntimeError("broken")))\n\n    response = TestClient(app).get("/health")\n\n    assert response.status_code == 200\n    assert response.json()["status"] == "alive"\n''', encoding="utf-8")
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/api/main.py backend/tests/test_p2_liveness.py
          git commit -m "fix: make health endpoint a true liveness probe"
          git push

      - name: Remove temporary runner
        shell: bash
        run: |
          git rm .github/workflows/_p2_2_closeout.yml
          git commit -m "chore: remove temporary p2-2 closeout runner"
          git push
