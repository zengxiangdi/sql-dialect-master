name: Temporary P2-2 test migration

on:
  push:
    branches: ["audit/close-p1-p2-gaps"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Update legacy health tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/tests/test_api.py")
          text = p.read_text(encoding="utf-8")
          old = '''    def test_health_contains_status(self):\n        """Health response contains status."""\n        response = client.get("/health")\n        data = response.json()\n        assert "status" in data\n        assert "healthy" in data["status"]\n    \n    def test_health_contains_services(self):\n        """Health response contains services info."""\n        response = client.get("/health")\n        data = response.json()\n        assert "services" in data\n        assert "transpiler" in data["services"]\n        assert "functions" in data["services"]\n'''
          new = '''    def test_health_is_liveness(self):\n        """Health endpoint exposes only process liveness."""\n        response = client.get("/health")\n        data = response.json()\n        assert response.status_code == 200\n        assert data["status"] == "alive"\n        assert data["version"]\n        assert "timestamp" in data\n        assert "services" not in data\n        assert "stats" not in data\n        assert "uptime" not in data\n        assert "checks" not in data\n'''
          if old not in text:
              raise SystemExit("legacy health test contract not found")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit and remove runner
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tests/test_api.py
          git commit -m "test: align health tests with liveness contract"
          git rm .github/workflows/_p2_2_test_migration.yml
          git commit -m "chore: remove temporary p2-2 test migration runner"
          git push
