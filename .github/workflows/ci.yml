name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e ".[dev]" --no-deps

      - name: Run full test suite
        run: pytest --cov=backend --cov-report=term-missing

      - name: Run API integration gate
        run: pytest backend/tests/test_audit_remaining_gaps.py -q

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Verify release metadata contract
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/verify_release.py --tag "v${version}"
          python scripts/verify_readme_consistency.py

      - name: Build distributable wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "wheel build produced no artifact"
          with ZipFile(wheels[-1]) as wheel:
              names = set(wheel.namelist())
          required = {
              "backend/core/functions_db.json",
              "backend/core/type_mapping.json",
          }
          missing = required - names
          assert not missing, f"wheel missing runtime data files: {sorted(missing)}"
          forbidden_prefixes = ("backend/tests/", "backend/benchmarks/")
          leaked = sorted(
              name for name in names if name.startswith(forbidden_prefixes)
          )
          assert not leaked, f"wheel contains development packages: {leaked}"
          print(f"Validated wheel: {wheels[-1].name}")
          PY

      - name: Smoke test installed wheel
        run: |
          smoke_dir="$RUNNER_TEMP/wheel-smoke"
          python -m pip install --target "$smoke_dir" --no-deps dist/*.whl
          cd "$smoke_dir"
          python - <<'PY'
          from backend.core.functions_lookup import FunctionEncyclopedia
          from backend.core.type_mapping import TypeMapper

          functions = FunctionEncyclopedia()
          mappings = TypeMapper()
          assert len(functions.functions) > 0, "installed wheel loaded no function data"
          assert len(mappings.mappings) > 0, "installed wheel loaded no type mapping data"
          print(
              "Installed wheel smoke test passed: "
              f"{len(functions.functions)} functions, {len(mappings.mappings)} type mappings"
          )
          PY
          cd "$GITHUB_WORKSPACE"
          wheel_venv="$RUNNER_TEMP/wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" - <<'PY'
          from backend.core import NL2SQLGenerator, SQLTranspiler

          converted = SQLTranspiler().transpile("SELECT id FROM users LIMIT 2", "postgres", "mysql")
          assert converted.success, converted.error
          generated = NL2SQLGenerator().generate("查询所有用户", dialect="mysql")
          assert generated.success, generated.explanation
          PY
          echo "Installed wheel SDK smoke test passed"

  semantic-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sql_dialect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sql_dialect_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked semantic test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-semantic-lock.txt
          pip install -e "." --no-deps

      - name: Run runtime semantic regression suite
        env:
          SDM_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sql_dialect_test
        run: |
          pytest backend/tests/test_runtime_semantics.py -q
          pytest backend/tests/semantic/test_runtime_semantics.py -q
          pytest backend/tests/semantic/test_duckdb_runtime.py -q
          pytest backend/tests/semantic/test_d3_date_runtime.py -q
          pytest backend/tests/semantic/test_postgres_runtime.py -q
