[project]
name = "sql-dialect-master"
version = "1.1.2"
description = "SQL Dialect Master - Multi-database SQL conversion engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=30.18.0,<31.0.0",
    "streamlit>=1.38.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]
qa = [
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
semantic = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.3.5",
]
redis = [
    "redis>=5.0.0",
]

[project.scripts]
sdm-streamlit = "backend.frontend_entrypoint:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]
exclude = ["backend.tests*", "backend.benchmarks*"]

# The Streamlit application is a top-level module documented as the
# user-facing entry point (``streamlit run sdm_local_v2.py``).  Include it in
# source and wheel distributions so an installed package has the same entry
# point as a source checkout.
[tool.setuptools]
py-modules = ["sdm_local_v2"]

[tool.setuptools.package-data]
"backend.core" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
