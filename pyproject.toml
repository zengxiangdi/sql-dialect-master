[project]
name = "sql-dialect-master"
version = "1.0.1"
description = "SQL Dialect Master - Multi-database SQL conversion engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.0.0",
    "streamlit>=1.38.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]
exclude = ["backend.tests*", "backend.benchmarks*"]

[tool.setuptools.package-data]
"backend.core" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
