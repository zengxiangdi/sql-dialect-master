[project]
name = "sql-dialect-master"
version = "1.1.6"
description = "SQL Dialect Master - Multi-database SQL conversion engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=30.18.0,<31.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]
qa = [
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2.2",
    "twine>=5.1",
    "setuptools>=75.0.0",
    "wheel>=0.45",
]
semantic = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.3.5",
]
redis = [
    "redis>=5.0.0",
]
[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*", "backend.benchmarks*"]

[tool.setuptools.package-data]
"backend.core" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
