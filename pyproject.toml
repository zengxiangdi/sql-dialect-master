[project]
name = "sql-dialect-master"
version = "1.5.0"
description = "SQL Dialect Master - Multi-database SQL conversion engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=30.18.0,<31.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]
qa = [
    "mypy>=1.11,<2.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2.2",
    "twine>=5.1",
    "setuptools>=75.0.0",
    "wheel>=0.45",
]
semantic = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.3.5",
]
redis = [
    "redis>=5.0.0",
]
[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*", "backend.benchmarks*"]

[tool.setuptools.package-data]
"backend.core" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
# Preserve imported type information without reporting errors outside this pilot.
follow_imports = "silent"
files = [
    "backend/core/nl2sql_llm.py",
    "backend/api/client_identity.py",
    "backend/api/workers.py",
    "backend/core/sql_statements.py",
    "backend/api/rate_limit_store.py",
    "backend/core/metadata.py",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/benchmarks/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 91
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
